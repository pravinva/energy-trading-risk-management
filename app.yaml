command:
  - uvicorn
  - app.backend.app:app
  - --host
  - 0.0.0.0
  - --port
  - '8000'

env:
  - name: DATABRICKS_SQL_WAREHOUSE_ID
    value: 4b9b953939869799
  - name: APEX_CATALOG
    value: apex_fresh
  - name: DATABRICKS_WORKSPACE_URL
    valueFrom: secret://DATABRICKS_WORKSPACE_URL
  - name: APEX_ENVIRONMENT
    value: dev
  - name: LAKEBASE_HOST
    valueFrom: secret://LAKEBASE_HOST
  - name: LAKEBASE_DATABASE
    valueFrom: secret://LAKEBASE_DATABASE

resources:
  - name: apex-db
    type: lakebase_database
