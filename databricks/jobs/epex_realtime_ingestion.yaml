name: "EPEX Real-time Market Data Ingestion"
description: "Ingests EPEX day-ahead prices, generation forecasts, and load data from ENTSOE every hour"

schedule:
  quartz_cron_expression: "0 0 * * * ?"  # Every hour at minute 0
  timezone_id: "Europe/Berlin"
  pause_status: "UNPAUSED"

email_notifications:
  on_failure:
    - trading-ops@company.com

max_concurrent_runs: 1

tasks:
  - task_key: "ingest_epex_day_ahead_de"
    description: "Ingest German day-ahead prices"
    python_wheel_task:
      package_name: "apex_trading"
      entry_point: "epex_ingest_day_ahead"
      parameters:
        - "--market-area"
        - "DE"
    new_cluster:
      spark_version: "13.3.x-scala2.12"
      node_type_id: "i3.xlarge"
      num_workers: 2
      spark_conf:
        spark.databricks.delta.preview.enabled: "true"
    timeout_seconds: 1800
    max_retries: 2
    retry_on_timeout: true

  - task_key: "ingest_epex_day_ahead_fr"
    description: "Ingest French day-ahead prices"
    depends_on:
      - task_key: "ingest_epex_day_ahead_de"
    python_wheel_task:
      package_name: "apex_trading"
      entry_point: "epex_ingest_day_ahead"
      parameters:
        - "--market-area"
        - "FR"
    existing_cluster_id: "{{cluster_id}}"
    timeout_seconds: 1800
    max_retries: 2

  - task_key: "ingest_epex_wind_forecast_de"
    description: "Ingest German wind generation forecast"
    depends_on:
      - task_key: "ingest_epex_day_ahead_fr"
    python_wheel_task:
      package_name: "apex_trading"
      entry_point: "epex_ingest_generation"
      parameters:
        - "--market-area"
        - "DE"
        - "--fuel-type"
        - "WIND_ONSHORE"
    existing_cluster_id: "{{cluster_id}}"
    timeout_seconds: 1800
    max_retries: 2

  - task_key: "ingest_epex_solar_forecast_de"
    description: "Ingest German solar generation forecast"
    depends_on:
      - task_key: "ingest_epex_wind_forecast_de"
    python_wheel_task:
      package_name: "apex_trading"
      entry_point: "epex_ingest_generation"
      parameters:
        - "--market-area"
        - "DE"
        - "--fuel-type"
        - "SOLAR"
    existing_cluster_id: "{{cluster_id}}"
    timeout_seconds: 1800
    max_retries: 2

  - task_key: "ingest_epex_load_forecast_de"
    description: "Ingest German load forecast"
    depends_on:
      - task_key: "ingest_epex_solar_forecast_de"
    python_wheel_task:
      package_name: "apex_trading"
      entry_point: "epex_ingest_load"
      parameters:
        - "--market-area"
        - "DE"
    existing_cluster_id: "{{cluster_id}}"
    timeout_seconds: 1800
    max_retries: 2

tags:
  market: "EPEX"
  data_source: "ENTSOE"
  frequency: "hourly"
  environment: "production"

access_control_list:
  - user_name: "trading-team@company.com"
    permission_level: "CAN_MANAGE_RUN"
  - group_name: "data-engineers"
    permission_level: "CAN_MANAGE"
