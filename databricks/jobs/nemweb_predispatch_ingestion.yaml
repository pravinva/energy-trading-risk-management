# Databricks Job: NEMWEB Pre-Dispatch Forecast Ingestion
# Runs every 30 minutes to ingest pre-dispatch forecasts

name: "NEMWEB Pre-Dispatch Forecast Ingestion"

schedule:
  quartz_cron_expression: "0 */30 * * * ?"  # Every 30 minutes
  timezone_id: "Australia/Sydney"
  pause_status: "UNPAUSED"

tasks:
  - task_key: "ingest_predispatch_all_regions"
    description: "Ingest pre-dispatch forecasts for all NEM regions"

    python_wheel_task:
      package_name: "apex_trading"
      entry_point: "nemweb_ingest"
      parameters:
        - "--data-type"
        - "PREDISPATCH"
        - "--regions"
        - "NSW1,VIC1,QLD1,SA1,TAS1"
        - "--hours"
        - "24"

    new_cluster:
      spark_version: "13.3.x-scala2.12"
      node_type_id: "i3.xlarge"
      num_workers: 2

    libraries:
      - pypi:
          package: "httpx"
      - pypi:
          package: "pydantic"

    timeout_seconds: 1200  # 20 minutes
    max_retries: 2

email_notifications:
  on_failure:
    - "pravin.varma@databricks.com"

tags:
  environment: "production"
  component: "data_ingestion"
  data_source: "nemweb"
  frequency: "every_30_minutes"
